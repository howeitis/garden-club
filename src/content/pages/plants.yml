page: plants
heroSubtitle: Natives to celebrate and invasives to avoid in the Delaware Piedmont.
nativesIntro: >-
  The Appalachian Piedmont region of northern Delaware supports a rich diversity of native
  wildflowers, trees, and shrubs. These species are adapted to our soils and climate, require less
  maintenance, and provide essential habitat for local pollinators and wildlife.
invasivesIntro: >-
  Every plant below is on Delaware's Invasive Plant List: since July 1, 2022 it has been illegal to
  sell, propagate, or transport them in the state. They aggressively displace native vegetation,
  damage forests, and disrupt habitat for wildlife. Please remove them where you can and choose
  native alternatives instead.
