page: gardens
heroSubtitle: Local treasures and regional destinations across the Brandywine Valley and beyond.
localIntro: >-
  The Delaware and Brandywine Valley region is home to some of the most beautiful public gardens in
  the country. We encourage our members and visitors to explore these treasures.
regionalIntro: >-
  Just beyond the Brandywine Valley, the greater Philadelphia region is home to historic botanical
  landmarks and inventive contemporary gardens — all within an easy day trip.
