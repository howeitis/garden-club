page: about
history: >-
  **Garden Gate Garden Club** was founded in **September 1963** by a small group of passionate
  gardeners who believed that community beauty begins at home.


  In **June 1964**, the club formally joined a regional garden federation, connecting our members
  with a wider network of horticulturalists, conservationists, and civic volunteers.


  In **October 2018**, the club was incorporated as a **501(c)(3) Organization**.
