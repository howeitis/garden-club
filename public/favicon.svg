<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!--
    Garden Gate Garden Club — small-size mark.
    A simplified drawing of the crest's gate (swan-neck rails, spear pickets,
    scroll bands, fleur motifs) with peach blossoms left and American holly
    right, on the ivory ground with a hairline gold ring. Drawn for 16–512px;
    the watercolor crest (gggc-clean.png) stays the logo at larger sizes.
    The PNG icons are generated from this file: `npm run build:icons`.
  -->
  <!-- ivory badge with a fine gold ring -->
  <circle cx="20" cy="20" r="19.2" fill="#FAF7F0" stroke="#856B2E" stroke-width="1.1"/>

  <!-- the gate, lifted so the ornament crowns the badge -->
  <g transform="translate(20 18.2) scale(.9) translate(-20 -20)">
    <g fill="none" stroke="#2A5434" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.2 12V33.5M33.8 12V33.5" stroke-width="2.4"/>
      <path d="M4.2 33.5H35.8" stroke-width="2.2"/>
      <path d="M7.6 17.2C11 16.9 15.4 14.4 19.2 9.4" stroke-width="1.6"/>
      <path d="M32.4 17.2C29 16.9 24.6 14.4 20.8 9.4" stroke-width="1.6"/>
      <path d="M7.6 28.4H32.4" stroke-width="1.3"/>
      <path d="M19.2 8.6V33.5M20.8 8.6V33.5" stroke-width="1.15"/>
      <path d="M10.4 14.6V33.5M13.4 13.5V33.5M16.4 11.6V33.5" stroke-width="1.15"/>
      <path d="M29.6 14.6V33.5M26.6 13.5V33.5M23.6 11.6V33.5" stroke-width="1.15"/>
      <g stroke-width=".95">
        <circle cx="8.9" cy="19.3" r="1.05"/><circle cx="11.9" cy="18.6" r="1.05"/><circle cx="14.9" cy="17.2" r="1.05"/><circle cx="17.8" cy="15.2" r="1"/>
        <circle cx="31.1" cy="19.3" r="1.05"/><circle cx="28.1" cy="18.6" r="1.05"/><circle cx="25.1" cy="17.2" r="1.05"/><circle cx="22.2" cy="15.2" r="1"/>
      </g>
      <path d="M18.9 9.9a2.1 2.1 0 1 0-1.4 3.6" stroke-width="1.1"/>
      <path d="M21.1 9.9a2.1 2.1 0 1 1 1.4 3.6" stroke-width="1.1"/>
      <g stroke-width="1">
        <path d="M13.4 20.6l2.1 2.8-2.1 2.8-2.1-2.8z"/>
        <path d="M26.6 20.6l2.1 2.8-2.1 2.8-2.1-2.8z"/>
      </g>
      <g stroke-width=".9">
        <circle cx="8.9" cy="30.9" r="1"/><circle cx="11.9" cy="30.9" r="1"/><circle cx="14.9" cy="30.9" r="1"/><circle cx="17.8" cy="30.9" r="1"/>
        <circle cx="31.1" cy="30.9" r="1"/><circle cx="28.1" cy="30.9" r="1"/><circle cx="25.1" cy="30.9" r="1"/><circle cx="22.2" cy="30.9" r="1"/>
      </g>
    </g>
    <g fill="#2A5434">
      <path d="M10.4 12.3l1 2.3h-2zM13.4 11.2l1 2.3h-2zM16.4 9.3l1 2.3h-2z"/>
      <path d="M29.6 12.3l1 2.3h-2zM26.6 11.2l1 2.3h-2zM23.6 9.3l1 2.3h-2z"/>
      <path d="M20 4.6l1.5 3.4h-3z"/>
      <path d="M6.2 9l1.6 3.2H4.6zM33.8 9l1.6 3.2h-3.2z"/>
      <circle cx="13.4" cy="23.4" r=".75"/><circle cx="26.6" cy="23.4" r=".75"/>
    </g>
  </g>

  <!-- peach blossoms, left — on a branch rising past the post, as in the crest -->
  <g transform="translate(-.4 -2.6)" stroke="#FAF7F0" stroke-width=".45" stroke-linejoin="round">
    <path d="M3.4 31.6C4.8 28.4 6.6 25.2 9.4 20.6" fill="none" stroke="#7A5A3A" stroke-width=".8" stroke-linecap="round"/>
    <!-- third blossom, higher and small -->
    <g transform="translate(8.6 21.4) scale(.6)" fill="#E4A9B8">
      <ellipse rx="1.15" ry="1.9" transform="rotate(10) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(82) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(154) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(226) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(298) translate(0 -1.6)"/>
      <circle r=".9" fill="#C9A24B"/>
    </g>
    <!-- open blossom -->
    <g transform="translate(6.2 26.2) scale(1.08)" fill="#E4A9B8">
      <ellipse rx="1.15" ry="1.9" transform="rotate(0) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(72) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(144) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(216) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(288) translate(0 -1.6)"/>
      <circle r=".9" fill="#C9A24B"/>
    </g>
    <!-- second blossom, smaller -->
    <g transform="translate(3.9 29.9) scale(.7)" fill="#D9A0AE">
      <ellipse rx="1.15" ry="1.9" transform="rotate(20) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(92) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(164) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(236) translate(0 -1.6)"/>
      <ellipse rx="1.15" ry="1.9" transform="rotate(308) translate(0 -1.6)"/>
      <circle r=".9" fill="#C9A24B"/>
    </g>
    <!-- buds -->
    <ellipse cx="10.3" cy="19.4" rx=".8" ry="1.2" fill="#D9A0AE" transform="rotate(-30 10.3 19.4)"/>
    <ellipse cx="4.6" cy="24.2" rx=".7" ry="1.1" fill="#E4A9B8" transform="rotate(-45 4.6 24.2)"/>
  </g>

  <!-- American holly, right — leaves fan outward from the post, as in the crest -->
  <g stroke="#FAF7F0" stroke-width=".55" stroke-linejoin="round">
    <path d="M33.6 26.6C34.2 24.6 35 22.6 36.2 20.2" fill="none" stroke="#7A5A3A" stroke-width=".8" stroke-linecap="round"/>
    <g transform="translate(35.8 20) rotate(36) scale(1.18)"><path d="M0.00 -3.60 L1.70 -2.30 L0.95 -1.70 L2.25 -0.60 L1.15 0.05 L2.15 1.25 L1.00 1.85 L1.45 2.90 L0.00 3.50 L-1.45 2.90 L-1.00 1.85 L-2.15 1.25 L-1.15 0.05 L-2.25 -0.60 L-0.95 -1.70 L-1.70 -2.30z" fill="#8CAB74"/><path d="M0 -2.8V2.8" stroke="#4E6C3F" stroke-width=".4" stroke-linecap="round"/></g>
    <g transform="translate(36.4 26.4) rotate(104) scale(1.18)"><path d="M0.00 -3.60 L1.70 -2.30 L0.95 -1.70 L2.25 -0.60 L1.15 0.05 L2.15 1.25 L1.00 1.85 L1.45 2.90 L0.00 3.50 L-1.45 2.90 L-1.00 1.85 L-2.15 1.25 L-1.15 0.05 L-2.25 -0.60 L-0.95 -1.70 L-1.70 -2.30z" fill="#A2BC8F"/><path d="M0 -2.8V2.8" stroke="#5E7F4C" stroke-width=".4" stroke-linecap="round"/></g>
    <circle cx="33.3" cy="24.4" r="1.2" fill="#B5343F"/>
    <circle cx="35" cy="22.8" r="1.15" fill="#C44450"/>
    <circle cx="33" cy="26.8" r="1.15" fill="#B5343F"/>
  </g>
</svg>
