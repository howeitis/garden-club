<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="#FEF0F5"/>
  <!-- 5 petals, alternating shades for depth -->
  <ellipse cx="16" cy="9" rx="3.8" ry="6" fill="#F2AABF" transform="rotate(0 16 16)"/>
  <ellipse cx="16" cy="9" rx="3.8" ry="6" fill="#EF96AF" transform="rotate(72 16 16)"/>
  <ellipse cx="16" cy="9" rx="3.8" ry="6" fill="#F2AABF" transform="rotate(144 16 16)"/>
  <ellipse cx="16" cy="9" rx="3.8" ry="6" fill="#EF96AF" transform="rotate(216 16 16)"/>
  <ellipse cx="16" cy="9" rx="3.8" ry="6" fill="#F2AABF" transform="rotate(288 16 16)"/>
  <!-- Center: outer ring + inner -->
  <circle cx="16" cy="16" r="4" fill="#F7D060"/>
  <circle cx="16" cy="16" r="2.2" fill="#E8A820"/>
</svg>
